name: Deploy static content

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: docker
    container:
      image: catthehacker/ubuntu:act-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        
      - name: Install rsync
        run: apt-get update && apt-get install -y --allow-downgrades --allow-remove-essential --allow-change-held-packages rsync

      - name: Deploy via rsync
        run: |
          echo "${{ secrets.SSH_DEPLOY_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          rsync -chavzP --stats --delete \
            -e "ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no" \
            ./dist/ \
            deploy@192.168.5.189:/var/www/html/
          rm /tmp/deploy_key
